categories:
  physical-activity:
    definition: Interventions and exposures involving bodily movement or exercise.
    status: Active
  environment:
    definition: Physical environmental conditions and exposures affecting quality of life.
    status: Active
  mental-health:
    definition: Psychological and emotional well-being, symptoms, and functioning.
    status: Active
  circadian:
    definition: Timing and regularity of sleep, wakefulness, and other circadian exposures.
    status: Active
  sleep:
    definition: Sleep duration, quality, continuity, conditions, and sleep-related functioning.
    status: Active
  time:
    definition: Time use, time pressure, and changes that recover or protect discretionary time.
    status: Active
  friction-reduction:
    definition: Practical changes that reduce recurring effort, inconvenience, or administrative burden.
    status: Active
  nutrition:
    definition: Food access, dietary patterns, meal choices, and nutrition-related exposures.
    status: Active
  sedentary-behavior:
    definition: Prolonged sitting or reclining and interventions intended to reduce sedentary exposure.
    status: Active
  work-design:
    definition: Work organization, workspace, scheduling, and job-related conditions affecting quality of life.
    status: Active
  pain:
    definition: Pain, musculoskeletal discomfort, and interventions affecting pain-related function.
    status: Active
  indoor-air:
    definition: Indoor air pollutants, ventilation, filtration, and related environmental exposures.
    status: Active
  preventive-health:
    definition: Preventive actions, risk reduction, screening, and health-maintenance interventions.
    status: Active
  attention:
    definition: Attention, focus, interruption, and cognitive workload affecting daily functioning.
    status: Active
  technology:
    definition: Digital devices, software, connectivity, and technology-mediated exposures or behaviors.
    status: Active
  substances:
    definition: Caffeine, alcohol, nicotine, and other substance exposures relevant to quality of life.
    status: Active
  financial-wellbeing:
    definition: Financial security, spending trade-offs, affordability, and money-related stress or well-being.
    status: Active
  strength:
    definition: Muscle-strengthening activity, physical strength, and related functional capacity.
    status: Active
