name: Release gate

on:
  push:
    branches:
      - main
      - career-radar/consolidate-expansions
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-gate:
    name: Canonical repository release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Consolidate Career Radar registries
        if: github.ref_name == 'career-radar/consolidate-expansions' && github.event.head_commit.message == 'ci: consolidate career radar registries'
        run: |
          python - <<'PY'
          from pathlib import Path

          radar = Path("career-radar")
          main_path = radar / "organizations.yaml"
          expansions = sorted(radar.glob("organizations-expansion-*.yaml"))

          parts = [main_path.read_text(encoding="utf-8").rstrip()]
          for path in expansions:
              lines = path.read_text(encoding="utf-8").splitlines()
              while lines and (not lines[0].strip() or lines[0].lstrip().startswith("#")):
                  lines.pop(0)
              part = "\n".join(lines).strip()
              if part:
                  parts.append(part)

          main_path.write_text("\n\n".join(parts) + "\n", encoding="utf-8")
          for path in expansions:
              path.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A career-radar
          git commit -m "chore: consolidate career radar registries [skip ci]"
          git push origin HEAD:career-radar/consolidate-expansions

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate canonical records and cross-references
        run: python -c "from qol_kb.records import validate_repository; validate_repository('.')"

      - name: Validate R&D career radar
        run: python -c "from qol_kb.career_radar import validate_career_radar; validate_career_radar('.')"

      - name: Verify deterministic generated output
        run: python -m qol_kb.views --check

      - name: Run full structural suite
        run: python -m unittest discover -s tests
