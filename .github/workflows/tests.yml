name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify generated views
        shell: bash
        run: |
          if ! python -m qol_kb.views --check; then
            python -m qol_kb.views
            git diff -- generated
            exit 1
          fi

      - name: Run tests
        run: python -m unittest discover -s tests
