name: Release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  release-gate:
    name: Canonical repository release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate canonical records and cross-references
        run: python -c "from qol_kb.records import validate_repository; validate_repository('.')"

      - name: Verify deterministic generated output
        run: python -m qol_kb.views --check

      - name: Run full structural suite
        run: python -m unittest discover -s tests
