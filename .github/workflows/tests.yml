name: Structural validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  structural-validation:
    name: Structure and determinism only; scientific review is human
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate canonical structure
        run: python -c "from qol_kb.records import validate_repository; validate_repository('.')"

      - name: Verify generated views
        shell: bash
        run: |
          if ! python -m qol_kb.views --check; then
            python -m qol_kb.views
            git diff -- generated
            exit 1
          fi

      - name: Run structural tests
        run: python -m unittest discover -s tests
